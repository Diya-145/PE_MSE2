[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishtiai-mlops-monitor"
version = "0.1.0"
description = "A small model-quality monitoring and retraining workflow."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.7",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.15"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["mlops_monitor*"]
